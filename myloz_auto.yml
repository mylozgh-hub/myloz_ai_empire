name: Myloz Safe Test

on: [workflow_dispatch]

jobs:
test:
runs-on: ubuntu-latest
steps:
- name: Download repository
uses: actions/checkout@v4

  - name: Check bot files
    run: |
      echo "Checking Myloz bot files"
      test -f myloz_live_spot_scanner.py
      test -f requirements.txt
      echo "Both files were found"

  - name: Check Python syntax
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Compile bot without running it
    run: python -m py_compile myloz_live_spot_scanner.py
