name: Myloz Safe Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check bot files and syntax
        run: |
          echo "Checking Myloz bot files"
          test -f myloz_live_spot_scanner.py
          test -f requirements.txt
          python -m py_compile myloz_live_spot_scanner.py
          echo "SUCCESS: Bot files found and Python syntax is valid"
