name: Myloz Bot Check

on:
  workflow_dispatch:

jobs:
  check-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download bot repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check bot file exists
        run: |
          test -f myloz_live_spot_scanner.py
          echo "Myloz bot file found"

      - name: Check Python syntax
        run: |
          python -m py_compile myloz_live_spot_scanner.py
          echo "Python syntax check passed"
